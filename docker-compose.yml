services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsmeow-coolify-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable
      - WA_PHONE_NUMBER=${WA_PHONE_NUMBER}
      - WA_CLIENT_NAME=${WA_CLIENT_NAME:-Chrome (Coolify)}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - API_KEY=${API_KEY}
      - ANTIBAN_PRESET=${ANTIBAN_PRESET:-moderate}
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COOLIFY_FQDN=${SERVICE_FQDN_WHATSAPP_BOT:-${COOLIFY_FQDN}}
      - SERVICE_FQDN_WHATSAPP_BOT=${SERVICE_FQDN_WHATSAPP_BOT}
    volumes:
      - wa_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wa-bot.rule=Host(`${SERVICE_FQDN_WHATSAPP_BOT:-${COOLIFY_FQDN:-localhost}}`)"
      - "traefik.http.routers.wa-bot.entrypoints=websecure"
      - "traefik.http.routers.wa-bot.tls=true"
      - "traefik.http.routers.wa-bot.tls.certresolver=letsencrypt"
      - "traefik.http.services.wa-bot.loadbalancer.server.port=8080"
      - "traefik.http.routers.wa-bot.middlewares=compress@docker"
    networks:
      - internal_net
      - coolify

  postgres:
    image: postgres:16-alpine
    container_name: whatsmeow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-whatsmeow}
    volumes:
      # PENTING: Volume ini WAJIB persisten di Coolify agar sesi WhatsApp tidak hilang saat restart / redeploy
      - wa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsmeow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_net

volumes:
  wa_pgdata:
    name: wa_pgdata
  wa_backups:
    name: wa_backups

networks:
  internal_net:
    driver: bridge
  coolify:
    external: true
    name: coolify
