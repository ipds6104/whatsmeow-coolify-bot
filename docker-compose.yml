services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-whatsmeow-coolify-bot}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      - PORT=8080
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-whatsmeow}
      - POSTGRES_HOST=wa-postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@wa-postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable
      - WA_PHONE_NUMBER=${WA_PHONE_NUMBER}
      - WA_CLIENT_NAME=${WA_CLIENT_NAME:-Chrome (Coolify)}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - API_KEY=${API_KEY}
      - ANTIBAN_PRESET=${ANTIBAN_PRESET:-moderate}
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COOLIFY_FQDN=${SERVICE_FQDN_WHATSAPP_BOT:-${COOLIFY_FQDN}}
      - SERVICE_FQDN_WHATSAPP_BOT=${SERVICE_FQDN_WHATSAPP_BOT}
    volumes:
      - wa_backups:/app/backups
    depends_on:
      wa-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-wa-bot}.rule=Host(`${SERVICE_FQDN_WHATSAPP_BOT:-${COOLIFY_FQDN:-localhost}}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-wa-bot}.entrypoints=https,http"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-wa-bot}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-wa-bot}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME:-wa-bot}.loadbalancer.server.port=8080"
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - internal_net
      - coolify

  wa-postgres:
    image: postgres:16.8-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-whatsmeow-postgres}
    restart: unless-stopped
    # Alokasi shared memory untuk queries & cache buffers
    shm_size: 512mb
    # Waktu toleransi graceful shutdown untuk menyelesaikan flush data & WAL
    stop_grace_period: 1m30s
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-whatsmeow}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      # PENTING: Volume ini WAJIB persisten di Coolify agar sesi WhatsApp tidak hilang saat restart / redeploy
      - wa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      internal_net:
        aliases:
          - wa-postgres
          - whatsmeow-postgres

volumes:
  wa_data:
    name: ${WA_DATA_VOLUME:-wa_data}
  wa_backups:
    name: ${WA_BACKUPS_VOLUME:-wa_backups}

networks:
  internal_net:
    driver: bridge
  coolify:
    external: true
    name: coolify
